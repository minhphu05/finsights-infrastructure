---
- name: Prepare Finsights Multi-Node Infrastructure
  hosts: finsights_hosts
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather host facts after bootstrap packages are ready
      ansible.builtin.setup:

    - name: Confirm that Ansible reached a supported Ubuntu host
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")
          - ansible_architecture in ["x86_64", "amd64", "aarch64", "arm64"]
        fail_msg: >-
          Finsights accepted production baseline is Ubuntu 24.04 LTS on x86_64 or ARM64.

    - name: Validate management SSH CIDR
      ansible.builtin.assert:
        that:
          - admin_ssh_cidr is match("^[0-9.]+/([0-9]|[12][0-9]|3[0-2])$")
        fail_msg: >-
          Set admin_ssh_cidr to a valid IPv4 CIDR (e.g. 0.0.0.0/0 or a specific /32).

  roles:
    - role: os_hardening
    - role: storage_mount
    - role: tailscale
    - role: host_firewall
    - role: docker_engine

- name: Configure K3s Control Plane (Server)
  hosts: finsights_control_plane
  become: true
  roles:
    - role: k3s

- name: Configure K3s Workers (Agents)
  hosts: finsights_workers
  become: true
  roles:
    - role: k3s

- name: Post-Setup Cluster Verification & Node Labeling
  hosts: finsights_control_plane
  become: true
  tasks:
    - name: Wait for worker nodes to join cluster and become Ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - --for=condition=Ready
          - "node/{{ item }}"
          - --timeout=120s
      loop: "{{ groups['finsights_workers'] }}"
      changed_when: false
      register: wait_worker_ready
      retries: 6
      delay: 10
      until: wait_worker_ready is success

    - name: Label worker nodes for database and workload scheduling
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - label
          - node
          - "{{ item }}"
          - node-role.kubernetes.io/worker=worker
          - database-node=true
          - --overwrite
      loop: "{{ groups['finsights_workers'] }}"
      changed_when: false

    - name: Fetch kubeconfig for Helm chart deployments
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../kubeconfig.yaml"
        flat: true
