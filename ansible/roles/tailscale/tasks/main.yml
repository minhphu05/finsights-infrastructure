---
- name: Enable IPv4 forwarding for Tailscale mesh
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Check if Tailscale is already installed
  ansible.builtin.command: which tailscale
  register: tailscale_binary
  failed_when: false
  changed_when: false

- name: Install Tailscale via official installer
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  when: tailscale_binary.rc != 0

- name: Ensure tailscaled service is enabled and started
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_status
  failed_when: false
  changed_when: false

- name: Validate Tailscale authentication status or authkey
  ansible.builtin.assert:
    that:
      - (tailscale_status.rc == 0 and 'Logged out' not in tailscale_status.stdout and 'NeedsLogin' not in tailscale_status.stdout) or (tailscale_authkey | length > 0)
    fail_msg: >-
      This node is not connected to Tailscale and no TAILSCALE_AUTHKEY was provided.
      Please generate a reusable auth key at https://login.tailscale.com/admin/settings/keys
      and pass it via the TAILSCALE_AUTHKEY environment variable or GitHub Secret.

- name: Authenticate and connect node to Tailscale network
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--authkey={{ tailscale_authkey }}"
      - "--hostname={{ inventory_hostname }}"
      - --accept-routes
      - --reset
  when:
    - (tailscale_status.rc != 0 or 'Logged out' in tailscale_status.stdout or 'NeedsLogin' in tailscale_status.stdout)
    - tailscale_authkey | length > 0

- name: Read assigned Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  register: ts_ip
  changed_when: false
  retries: 15
  delay: 2
  until: ts_ip.rc == 0 and (ts_ip.stdout | trim | length > 0)

- name: Register tailscale_ip host fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ ts_ip.stdout | trim }}"

- name: Output Tailscale IP
  ansible.builtin.debug:
    msg: "Node {{ inventory_hostname }} joined Tailscale with IP {{ tailscale_ip }}"

- name: Verify inter-node Tailscale ping connectivity
  ansible.builtin.command: "ping -c 3 -W 5 {{ hostvars[item]['tailscale_ip'] }}"
  loop: "{{ groups['finsights_hosts'] }}"
  when:
    - item != inventory_hostname
    - hostvars[item]['tailscale_ip'] is defined
  changed_when: false
  retries: 5
  delay: 3
  register: ping_test
  until: ping_test.rc == 0
