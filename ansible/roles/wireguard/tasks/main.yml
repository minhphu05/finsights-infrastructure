---
- name: Install WireGuard and network tools
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
      - iproute2
    state: present
    update_cache: yes

- name: Enable IPv4 forwarding for WireGuard mesh
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: yes

- name: Ensure WireGuard directory exists with strict permissions
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check if WireGuard private key exists
  ansible.builtin.stat:
    path: /etc/wireguard/private.key
  register: wg_priv_stat

- name: Generate WireGuard private key
  ansible.builtin.shell:
    cmd: "wg genkey > /etc/wireguard/private.key && chmod 600 /etc/wireguard/private.key"
  when: not wg_priv_stat.stat.exists

- name: Generate WireGuard public key from private key
  ansible.builtin.shell:
    cmd: "wg pubkey < /etc/wireguard/private.key > /etc/wireguard/public.key && chmod 644 /etc/wireguard/public.key"

- name: Read WireGuard private key
  ansible.builtin.command: cat /etc/wireguard/private.key
  register: wg_private_key
  changed_when: false
  no_log: true

- name: Read WireGuard public key
  ansible.builtin.command: cat /etc/wireguard/public.key
  register: wg_public_key
  changed_when: false

- name: Register WireGuard public key as host fact
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wg_public_key.stdout | trim }}"

- name: Deploy WireGuard wg0 mesh configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: Ensure WireGuard wg0 service is enabled and running
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
    state: started
